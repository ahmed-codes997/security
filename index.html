<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🛡️ المرشد الأمني الذكي</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🛡️ المرشد الأمني الذكي</h1>
        <p class="subtitle">✅ راقب حسابك وتأكد من أمانه</p>

        <!-- لوحة التحكم -->
        <div class="dashboard">
            <div class="status-card safe">
                <span class="status-icon">🟢</span>
                <div>
                    <strong>حالة الحساب</strong>
                    <span id="accountStatus">جاري الفحص...</span>
                </div>
            </div>
            <div class="status-card">
                <span class="status-icon">📊</span>
                <div>
                    <strong>آخر فحص</strong>
                    <span id="lastCheck">الآن</span>
                </div>
            </div>
        </div>

        <!-- زر الفحص السريع -->
        <button id="scanBtn" class="scan-btn">🔍 افحص حسابي الآن</button>

        <!-- قائمة المهام -->
        <div id="taskList"></div>

        <!-- نتائج المراقبة -->
        <div id="monitorResults" class="monitor-results"></div>

        <div class="note">
            💡 <strong>المهم:</strong> الأداة تراقب إعداداتك وتنبهك لو في أي مشكلة!
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
